# Unvara model catalog — hand-curated sources.
# `bun script/catalog/build.ts` turns this into catalog/catalog.json (sizes, sha256, GGUF dims come from Hugging Face).
#
# uncensored: abliterated | heretic | finetune | null (official)
# activeParams: required for MoE models (billions), e.g. 3 for "A3B"
# quants: optional allow-list; by default the usual ladder (Q2…Q8, IQ3/IQ4, MXFP4) is offered
# exclude: filename parts to skip; drafts, MTP heads and imatrix files are always skipped
# capabilities are auto-detected from the chat template; list them here to force them on

# ── Uncensored ──────────────────────────────────────────────────────────────
- id: qwen3.6-35b-a3b-abliterated
  repo: mradermacher/Huihui-Qwen3.6-35B-A3B-abliterated-GGUF
  name: Qwen3.6 35B A3B
  family: qwen
  uncensored: abliterated
  base: Qwen/Qwen3.6-35B-A3B
  activeParams: 3
  tags: [moe, code, agent, multilingual]
  sampling: { temperature: 0.7, topP: 0.8, topK: 20, minP: 0 }
  description:
    en: Mixture-of-experts model that thinks like a 35B but runs like a 3B. The best all-rounder for 8–12 GB GPUs with 32 GB RAM.
    ru: MoE-модель, которая думает как 35B, а работает со скоростью 3B. Лучший универсал для видеокарт на 8–12 ГБ и 32 ГБ оперативки.

