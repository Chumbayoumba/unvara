name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: |
          for dir in core opencode app desktop; do
            (cd packages/$dir && bun run typecheck)
          done

      - name: Test app (local AI, translations, settings, session index)
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts src/local-models src/i18n src/context/settings.test.ts src/context/global-sync

      - name: Test local AI (desktop)
        working-directory: packages/desktop
        run: bun test src/main/local-models

      - name: Test Unvara server changes
        working-directory: packages/opencode
        run: bun test test/session/unvara-tools.test.ts test/config/config.test.ts

      - name: Test core
        working-directory: packages/core
        run: bun test test/util/user-env.test.ts
